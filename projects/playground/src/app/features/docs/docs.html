<div class="docs-marco">
  <nav class="indice" [attr.aria-label]="'docs.nav.aria' | transloco">
    @for (s of secciones; track s.id) {
      <a [routerLink]="rutas.slug(s.id)" routerLinkActive="activo">
        <strong>{{ s.tituloClave | transloco }}</strong>
        <span>{{ s.notaClave | transloco }}</span>
      </a>
    }
  </nav>

  <article class="docs-pagina">
    <router-outlet />
  </article>
</div>
