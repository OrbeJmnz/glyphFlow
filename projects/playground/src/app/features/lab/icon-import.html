<section class="import" [class.abierto]="abierto()">
  <button type="button" class="import-toggle" [attr.aria-expanded]="abierto()" (click)="alternar()">
    <gf-icon [iconDef]="iconoImportar" [size]="15" trigger="manual" />
    {{ 'lab.iconImport.toggle' | transloco }}
    <span class="flecha" aria-hidden="true">{{ abierto() ? '▾' : '▸' }}</span>
  </button>

  @if (abierto()) {
    <div class="import-body">
      @if (desdeEditor(); as nombre) {
        <p
          class="import-nota desde-editor"
          [innerHTML]="'lab.iconImport.desdeEditor' | transloco: { nombre: nombre }"
        ></p>
      }
      <p class="import-nota" [innerHTML]="'lab.iconImport.instrucciones' | transloco"></p>
      <button type="button" app-boton compacto (click)="cargarEjemplo()">
        {{ 'lab.iconImport.cargarEjemplo' | transloco }}
      </button>
      <textarea
        class="entrada"
        rows="8"
        placeholder='{ "icono": ..., "shapes": [...], "animations": {...} }'
        [value]="entrada()"
        (input)="entrada.set($any($event.target).value)"
      ></textarea>

      @let r = resultado();
      @if (r && 'errorKey' in r) {
        <p class="error">{{ r.errorKey | transloco }}</p>
      } @else if (r) {
        <div class="preview">
          <gf-icon [iconDef]="r.def" [size]="32" trigger="hover" />
          <span
            >{{ r.nombre ?? ('lab.iconImport.sinNombre' | transloco) }} —
            {{ 'lab.iconImport.previewHint' | transloco }}</span
          >
        </div>
      }
    </div>
  }
</section>
