<section class="import" [class.abierto]="abierto()">
  <button type="button" class="import-toggle" (click)="alternar()">
    {{ abierto() ? '▾' : '▸' }} Importar coreografía (JSON)
  </button>

  @if (abierto()) {
    <div class="import-body">
      <p class="import-nota">
        Pega el JSON que copiaste de "Exportar JSON" en el panel de detalle. Se previsualiza con el
        mismo <code>[iconDef]</code> que usa el resto del playground.
      </p>
      <button type="button" class="ejemplo" (click)="cargarEjemplo()">cargar ejemplo (bell)</button>
      <textarea
        class="entrada"
        rows="8"
        placeholder='{ "icono": ..., "shapes": [...], "animations": {...} }'
        [value]="entrada()"
        (input)="entrada.set($any($event.target).value)"
      ></textarea>

      @let r = resultado();
      @if (r && 'error' in r) {
        <p class="error">{{ r.error }}</p>
      } @else if (r) {
        <div class="preview">
          <max-icon [iconDef]="r.def" [size]="32" trigger="hover" />
          <span>{{ r.nombre }} — pasa el puntero para animarlo</span>
        </div>
      }
    </div>
  }
</section>
