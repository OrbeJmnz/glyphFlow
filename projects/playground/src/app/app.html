<header class="head">
  <h1>glyphflow</h1>
  <p>
    Los <strong>{{ total() }}</strong> iconos curados, con su coreografía a mano. Pasa el puntero
    sobre una tarjeta o dale a repetir.
  </p>
  <button type="button" class="repeat-all" (click)="repetirTodo()">Repetir todo</button>
</header>

<app-morph-bench />

<main class="grid">
  @for (entry of entries; track entry.name; let i = $index) {
    <article class="card">
      <max-icon [iconDef]="entry.def" [size]="32" trigger="group" />
      <span class="name">{{ entry.name }}</span>
      <button type="button" class="repeat" (click)="repetir(i)" [attr.aria-label]="'Repetir ' + entry.name">
        repetir
      </button>
    </article>
  }
</main>

<footer class="foot">
  Consumiendo <code>glyphflow</code> desde npm, igual que cualquier otro proyecto.
</footer>
