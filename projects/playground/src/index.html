<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>glyphflow — iconos de Lucide animados para Angular</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Iconos de Lucide animados sobre Web Animations API nativa. Cero dependencias de animación, tree-shaking real, morph entre formas."
    />
    <!--
      Una sola etiqueta, sin `media`: la barra del navegador en Android tiene que seguir al tema
      ELEGIDO, y un par con `media="(prefers-color-scheme: …)"` seguiría al del sistema. Quien
      arranca con el sistema en claro y pone el sitio en oscuro se quedaría con la barra blanca
      sobre una página negra. `core/tema.ts` reescribe este `content` en cada cambio.
    -->
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Vista previa al compartir el enlace. Va en PNG y no en SVG a propósito: los scrapers de redes
      no renderizan SVG, así que un `og:image` en SVG se ve como enlace pelado. El 1200w es el
      tamaño que piden las tarjetas grandes.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="glyphflow — iconos de Lucide animados para Angular" />
    <meta
      property="og:description"
      content="Animados sobre Web Animations API nativa. Cero dependencias de animación, tree-shaking real, morph entre formas."
    />
    <meta property="og:image" content="/images/glyphflow-logo-1200w.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="406" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Outfit, la tipografía del sitio. `preconnect` a los dos orígenes porque los archivos .woff2
      viven en gstatic, no en googleapis: sin el segundo, el navegador descubre ese host hasta que
      ya bajó el CSS y la fuente entra tarde.
      Solo los pesos que se usan (300/400/500/600) — pedir el rango completo baja peso muerto.
      `display=swap`: el texto se ve con la fuente del sistema mientras Outfit llega, en vez de
      quedarse invisible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
