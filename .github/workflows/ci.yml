name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build, bundle, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Primero glyphflow: playground importa 'glyphflow' vía path mapping a dist/glyphflow (que
      # está en .gitignore) — sin este build, lint/typecheck/test de playground truenan con
      # "Cannot find module 'glyphflow'" en un checkout limpio, aunque localmente "funcione" por
      # dist/ ya construido de sesiones anteriores. Bug real encontrado por un readiness review.
      # LICENSE, NOTICE y el README real viven en la raíz del workspace; ng-packagr solo empaqueta
      # lo que está DENTRO del paquete. Sin esta copia el tarball sale sin licencia y sin la
      # atribución ISC de Lucide, cuyos paths sí van redistribuidos en el bundle. `--check` porque
      # las copias están commiteadas: aquí solo se verifica que no se hayan quedado atrás.
      - name: LICENSE/NOTICE/README en sync con la raíz
        run: npm run sync:package-files:check

      - name: Build glyphflow (production, requisito para todo lo que sigue)
        run: npx ng build glyphflow --configuration production

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Va ANTES de los tests a propósito: el barrido truena ante el mismo drift, pero con la
      # huella cruda. Este paso escupe el diff anotado (qué figura se movió, qué coreografía se
      # apoya en ella) para que el fallo se lea desde el log de Actions, sin clonar nada.
      - name: Drift del lock de coreografía curada
        run: npm run curated:lock:check

      - name: Unit tests (glyphflow)
        run: npx ng test glyphflow --watch=false

      - name: Unit tests (playground)
        run: npx ng test playground --watch=false

      - name: Build glyphflow (development, catches issues prod hides)
        run: npx ng build glyphflow --configuration development

      - name: Build playground
        run: npx ng build playground

      # Los tres pasos siguientes llaman a `npm run ...`, no a `tsx` a secas: un `run:` de GitHub
      # Actions no trae node_modules/.bin en el PATH por defecto (a diferencia de `npm run`, que sí
      # lo resuelve solo) — invocar tsx directo tronaba con "command not found" (exit 127). Cada
      # script además reconstruye glyphflow en modo production por su cuenta, así que no dependen
      # del orden de los pasos de build de arriba.
      - name: SSR smoke test
        run: npm run test:ssr

      - name: Bundle-size check (casos A/B — ver v0.1 del plan)
        run: npm run bundle-check

      - name: NOTICE check
        run: npm run notice-check

      - name: npm pack + instalar en proyecto limpio + import real
        run: npm run pack-check

  build-tarball:
    name: Build tarball (toolchain real del workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Se compila UNA sola vez con Angular 22 / TypeScript 6.0.2 (el toolchain real del
      # workspace) — nunca se fuerza ni se pinea typescript para simular otras versiones de
      # Angular. La compatibilidad real se prueba consumiendo ESTE mismo .tgz desde una app nueva
      # de cada versión (ver job angular-compat), no recompilando la librería bajo otro toolchain.
      - run: npx ng build glyphflow --configuration production

      - name: npm pack
        # --pack-destination NO crea el directorio destino solo (verificado local: ENOENT si no
        # existe) — falta el mkdir explícito, no es opcional.
        run: |
          mkdir -p "$RUNNER_TEMP/tarball"
          npm pack --pack-destination "$RUNNER_TEMP/tarball" ./dist/glyphflow

      - uses: actions/upload-artifact@v4
        with:
          name: glyphflow-tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          retention-days: 1

  angular-compat:
    name: Compat Angular ${{ matrix.angular-version }} (app consumidora real)
    needs: build-tarball
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rango real de peerDependencies (ver v0.1 del plan) — se amplía solo cuando esta matriz
        # pasa en verde para la versión nueva, nunca antes. Cada versión trae su PROPIO toolchain
        # (Angular CLI + TypeScript que ESA versión declara soportar) — no se fuerza nada.
        angular-version: [20, 21, 22]
    steps:
      - uses: actions/checkout@v4

      # Sin `cache:` a propósito — este job no corre `npm ci` sobre el repo (solo necesita `node`
      # para ejecutar wire-consumer-app.mjs, que no tiene dependencias externas). `cache: false`
      # (booleano) truena con "Caching for 'false' is not supported" — el input espera un string
      # ('npm'/'yarn'/'pnpm') o que la clave no exista, nunca `false` literal.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: glyphflow-tarball
          path: ${{ runner.temp }}/tarball

      - name: Scaffold una app Angular ${{ matrix.angular-version }} limpia (su propio CLI, su propio TypeScript)
        working-directory: ${{ runner.temp }}
        run: npx -p @angular/cli@${{ matrix.angular-version }} ng new consumer-app --minimal --ssr --skip-git --package-manager=npm --style=css

      - name: Instalar el .tgz real (mismo artefacto para las 3 versiones)
        working-directory: ${{ runner.temp }}/consumer-app
        run: npm install "$RUNNER_TEMP"/tarball/*.tgz --legacy-peer-deps

      - name: Import real en la app consumidora
        run: node scripts/wire-consumer-app.mjs "${{ runner.temp }}/consumer-app"

      - name: Build (incluye prerender SSR de la ruta / por default de Angular)
        working-directory: ${{ runner.temp }}/consumer-app
        run: npx ng build

  release:
    name: Release (changesets)
    needs: [ci, angular-compat]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Gate de aprobación: con "Required reviewers" configurado en Settings → Environments, el job
    # se queda esperando revisión humana ANTES de correr el publish. Es el freno que impide que un
    # merge a main publique solo — sin changesets pendientes, changesets/action ejecuta el publish
    # en cada push. OJO: si el environment no existe, Actions lo crea al vuelo SIN reglas y el
    # gate no frena nada; la protección vive en el environment, no en esta línea.
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      # Trusted publishing (OIDC): npm cambia el token de larga vida por un id-token efímero que
      # el runner pide en tiempo de ejecución. Sin este permiso no existe el token y npm cae a
      # buscar credenciales clásicas. Es un permiso POR JOB — ningún otro job lo lleva.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Node 22 trae npm 10.9.x y el trusted publishing por OIDC aterrizó en npm 11.5.1: sin este
      # paso, npm ni intenta pedir el id-token y falla pidiendo credenciales. Va DESPUÉS de
      # `npm ci` a propósito — la instalación se hace con el npm que el lockfile espera, y solo el
      # publish corre con el npm nuevo.
      - name: npm >= 11.5.1 (requisito de trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version

      # Sin NPM_TOKEN ni NODE_AUTH_TOKEN: la autenticación la resuelve el id-token de OIDC contra
      # el trusted publisher configurado en npmjs.com para este paquete. Un token en el entorno
      # tendría prioridad y anularía el mecanismo, así que su ausencia es parte del diseño.
      # `changeset publish` publicaría desde la carpeta del paquete en el workspace
      # (projects/glyphflow), que tiene el CÓDIGO FUENTE: .ts, specs, tsconfigs, y ningún
      # fesm2022/ ni types/ — los genera ng-packagr al construir. Sería una versión rota en el
      # registro, y los números de npm no se reescriben. Por eso se publica dist/ explícitamente,
      # igual que el publish manual de la 1.0.0. `changeset git-tag` conserva los tags que
      # `changeset publish` habría creado; la action los empuja con --follow-tags.
      #
      # La ruta va con `./`: sin él, npm lee `dist/glyphflow` como atajo de repositorio git
      # (owner/repo) e intenta clonar ssh://git@github.com/dist/glyphflow.git. Encontrado
      # probando el script en local con --dry-run antes de commitear.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
