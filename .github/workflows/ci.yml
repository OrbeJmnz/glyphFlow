name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build, bundle, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (glyphflow)
        run: npx ng test glyphflow --watch=false

      - name: Unit tests (playground)
        run: npx ng test playground --watch=false

      - name: Build (dev, catches issues prod hides)
        run: npx ng build glyphflow --configuration development

      - name: Build (prod, partial compilation mode)
        run: npx ng build glyphflow --configuration production

      - name: Build playground
        run: npx ng build playground

      - name: SSR smoke test
        run: tsx scripts/ssr-smoke-test.ts

      - name: Bundle-size check (casos A/B — ver v0.1 del plan)
        run: tsx scripts/bundle-size-check.ts

      - name: NOTICE check
        run: node scripts/notice-check.mjs

      - name: npm pack + instalar en proyecto limpio + import real
        run: tsx scripts/pack-check.ts

  angular-compat:
    name: Compat Angular ${{ matrix.angular-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rango real de peerDependencies (ver v0.1 del plan) — se amplía solo cuando esta matriz
        # pasa en verde para la versión nueva, nunca antes.
        angular-version: [20, 21, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Override a Angular ${{ matrix.angular-version }} (sin tocar el lockfile)
        run: |
          npm install --no-save \
            @angular/core@${{ matrix.angular-version }} \
            @angular/common@${{ matrix.angular-version }} \
            @angular/compiler@${{ matrix.angular-version }} \
            @angular/compiler-cli@${{ matrix.angular-version }} \
            @angular/platform-browser@${{ matrix.angular-version }} \
            @angular/platform-server@${{ matrix.angular-version }} \
            @angular/build@${{ matrix.angular-version }} \
            @angular/cli@${{ matrix.angular-version }} \
            ng-packagr@${{ matrix.angular-version }}

      - name: Build contra Angular ${{ matrix.angular-version }}
        run: npx ng build glyphflow --configuration production

      - name: Unit tests contra Angular ${{ matrix.angular-version }}
        run: npx ng test glyphflow --watch=false

      - name: SSR smoke test contra Angular ${{ matrix.angular-version }}
        run: tsx scripts/ssr-smoke-test.ts

  release:
    name: Release (changesets)
    needs: [ci, angular-compat]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run build -- glyphflow --configuration production && npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
